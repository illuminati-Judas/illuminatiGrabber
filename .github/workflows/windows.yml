name: Windows portable distribution
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Tests and validation
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'JS tests failed' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Extension validation failed' }
          python -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
          $files = Get-ChildItem installer/windows,scripts,tests -Filter '*.ps1' -Recurse
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Install build tool (runner only)
        run: python -m pip install 'pyinstaller==6.11.1'
      - name: Build, package and exercise extracted Windows delivery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build-windows.ps1
      - name: Upload verified portable ZIP and archive checksum
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/windows/illuminatiGrabber-windows-x64.zip
            dist/windows/illuminatiGrabber-windows-x64.zip.sha256
